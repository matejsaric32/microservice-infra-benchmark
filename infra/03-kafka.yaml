---
# Apache Kafka in KRaft mode (NO ZOOKEEPER) - Performance Optimized
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: perf-test
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 9093
              name: controller
          env:
            # KRaft Mode Configuration
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"

            # Listener Configuration
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"

            # Cluster Configuration
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"

            # Replication Settings for Single Broker
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"

            # Auto-create topics
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_NUM_PARTITIONS
              value: "6"

            # Performance: Network & I/O Threads
            - name: KAFKA_NUM_NETWORK_THREADS
              value: "8"
            - name: KAFKA_NUM_IO_THREADS
              value: "16"
            - name: KAFKA_SOCKET_SEND_BUFFER_BYTES
              value: "1048576"
            - name: KAFKA_SOCKET_RECEIVE_BUFFER_BYTES
              value: "1048576"
            - name: KAFKA_SOCKET_REQUEST_MAX_BYTES
              value: "104857600"

            # Performance: Producer/Consumer Batching
            - name: KAFKA_MESSAGE_MAX_BYTES
              value: "10485760"
            - name: KAFKA_REPLICA_FETCH_MAX_BYTES
              value: "10485760"
            - name: KAFKA_FETCH_MAX_BYTES
              value: "52428800"

            # Performance: Log Settings
            - name: KAFKA_LOG_DIRS
              value: "/tmp/kraft-combined-logs"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "1"
            - name: KAFKA_LOG_RETENTION_BYTES
              value: "1073741824"
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: "536870912"
            - name: KAFKA_LOG_FLUSH_INTERVAL_MESSAGES
              value: "50000"
            - name: KAFKA_LOG_FLUSH_INTERVAL_MS
              value: "10000"

            # Performance: Compression
            - name: KAFKA_COMPRESSION_TYPE
              value: "producer"

            # Performance: Request handling
            - name: KAFKA_QUEUED_MAX_REQUESTS
              value: "1000"
            - name: KAFKA_REQUEST_TIMEOUT_MS
              value: "30000"

            # Memory Settings - Increased for performance
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx1g -Xms1g -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35"

          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"

      # Init container to wait for Kafka and create topic
      initContainers: []

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: perf-test
  labels:
    app: kafka
spec:
  type: ClusterIP
  ports:
    - port: 9092
      targetPort: 9092
      protocol: TCP
      name: kafka
  selector:
    app: kafka

---
# Job to create the order-events topic with optimal settings
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-creator
  namespace: perf-test
  labels:
    app: kafka-setup
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: kafka-setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-topic-creator
          image: apache/kafka:3.7.0
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for Kafka to be ready..."
              until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1; do
                echo "Kafka not ready, waiting..."
                sleep 5
              done
              echo "Kafka is ready!"
              
              echo "Creating order-events topic..."
              /opt/kafka/bin/kafka-topics.sh --create \
                --bootstrap-server kafka:9092 \
                --topic order-events \
                --partitions 6 \
                --replication-factor 1 \
                --config retention.ms=3600000 \
                --config segment.bytes=536870912 \
                --config max.message.bytes=10485760 \
                --config min.insync.replicas=1 \
                --if-not-exists
              
              echo "Listing topics..."
              /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server kafka:9092
              
              echo "Topic details:"
              /opt/kafka/bin/kafka-topics.sh --describe --topic order-events --bootstrap-server kafka:9092
              
              echo "Done!"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"