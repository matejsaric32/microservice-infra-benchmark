apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-reactive-perf-native
  namespace: perf-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quarkus-reactive-perf
  template:
    metadata:
      labels:
        app: quarkus-reactive-perf
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/q/metrics"
    spec:
      containers:
        - name: quarkus-reactive-perf
          image: localhost/quarkus-reactive-perf-native:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: quarkus-reactive-perf-config
            - secretRef:
                name: perf-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 1
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 1
            timeoutSeconds: 2
            failureThreshold: 60