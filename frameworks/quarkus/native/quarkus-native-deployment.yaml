apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-perf-native
  namespace: perf-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quarkus-perf-native
  template:
    metadata:
      labels:
        app: quarkus-perf-native
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/q/metrics"
    spec:
      containers:
        - name: quarkus-perf-native
          image: ghcr.io/matejsaric32/quarkus-perf-native:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: quarkus-perf-config
            - secretRef:
                name: perf-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"