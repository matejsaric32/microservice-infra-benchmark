---
apiVersion: v1
kind: Service
metadata:
  name: spring-perf
  namespace: perf-test
  labels:
    app: spring-perf
spec:
  type: ClusterIP    # Changed from LoadBalancer for KIND compatibility
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: spring-perf