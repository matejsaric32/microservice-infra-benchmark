apiVersion: apps/v1
kind: Deployment
metadata:
  name: actix-perf
  namespace: perf-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: actix-perf
  template:
    metadata:
      labels:
        app: actix-perf
    spec:
      containers:
        - name: actix-perf
          image: ghcr.io/matejsaric32/actix-perf:latest
          imagePullPolicy: Always
          workingDir: /app
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /app/config.yml
              subPath: config.yml
          env:
            - name: RUST_BACKTRACE
              value: "1"
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: actix-perf-yaml-config