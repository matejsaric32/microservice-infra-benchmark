  s6-ingress-load-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Backend service",
            "type": "query",
            "datasource": "Prometheus",
            "query": "label_values(nginx_ingress_controller_request_duration_seconds_count, service)",
            "definition": "label_values(nginx_ingress_controller_request_duration_seconds_count, service)",
            "refresh": 2,
            "includeAll": true,
            "multi": false,
            "current": { "text": "All", "value": "$__all" },
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "datasource": "Prometheus",
          "title": "Ingress Request Rate (RPS) by service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "lastNotNull", "max"], "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum by (service) (rate(nginx_ingress_controller_requests[1m]))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": "Prometheus",
          "title": "Ingress p95 Latency by service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
