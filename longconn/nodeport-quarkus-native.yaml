---
# Direct NodePort for the long-lived-connection arm (scripts/S9_longconn.js,
# scripts/S10_longconn_with_metrics.sh). Bypasses the NGINX ingress so that
# keep-alive connections terminate on the quarkus-perf-native pod itself.
# Generated from nodeport-template.yaml.
apiVersion: v1
kind: Service
metadata:
  name: quarkus-perf-native-direct
  namespace: perf-test
  labels:
    app: quarkus-perf-native
    longconn: "true"
spec:
  type: NodePort
  selector:
    app: quarkus-perf-native
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
      nodePort: 31095
