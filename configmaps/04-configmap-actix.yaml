apiVersion: v1
kind: ConfigMap
metadata:
  name: actix-perf-yaml-config
  namespace: perf-test
data:
  config.yml: |
    database:
      host: "postgresql"
      port: 5432
      name: "postgres"
      username: "perf_a"
      password: "1234567890"
      schema: "perf"
      pool:
        max_connections: 50
        min_connections: 2
        connection_timeout_secs: 30
        idle_timeout_secs: 600
    redis:
      host: "redis"
      port: 6379
      ttl: 300
    kafka:
      brokers: "kafka:9092"
      default_topic: "order-events"
      client_id: "rust-perf-producer"
      timeout_ms: 5000