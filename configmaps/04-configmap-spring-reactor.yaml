apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-reactor-perf-config
  namespace: perf-test
data:
  # Application name
  SPRING_APPLICATION_NAME: "spring-reactor-perf"

  # R2DBC PostgreSQL configuration
  SPRING_R2DBC_URL: "r2dbc:postgresql://postgresql:5432/postgres?schema=perf"
  SPRING_R2DBC_HOST: "postgresql"
  SPRING_R2DBC_PORT: "5432"
  SPRING_R2DBC_SCHEMA: "perf"
  SPRING_R2DBC_DATABASE: "postgres"
  SPRING_R2DBC_POOL_ENABLED: "true"
  SPRING_R2DBC_POOL_INITIAL_SIZE: "10"
  SPRING_R2DBC_POOL_MAX_SIZE: "50"
  SPRING_R2DBC_POOL_MAX_IDLE_TIME: "30m"
  SPRING_R2DBC_POOL_MAX_ACQUIRE_TIME: "3s"
  SPRING_R2DBC_POOL_MAX_CREATE_CONNECTION_TIME: "5s"
  SPRING_R2DBC_POOL_VALIDATION_QUERY: "SELECT 1"

  # Redis configuration
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_DATABASE: "0"
  SPRING_DATA_REDIS_TIMEOUT: "2000ms"
  SPRING_DATA_REDIS_CONNECT_TIMEOUT: "5000ms"
  SPRING_DATA_REDIS_CLIENT_TYPE: "lettuce"
  SPRING_DATA_REDIS_LETTUCE_POOL_ENABLED: "true"
  SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE: "50"
  SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE: "20"
  SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE: "5"
  SPRING_DATA_REDIS_LETTUCE_POOL_MAX_WAIT: "3000ms"
  SPRING_DATA_REDIS_LETTUCE_CLUSTER_REFRESH_ADAPTIVE: "true"
  SPRING_DATA_REDIS_LETTUCE_CLUSTER_REFRESH_PERIOD: "30s"
  SPRING_DATA_REDIS_LETTUCE_SHUTDOWN_TIMEOUT: "200ms"

  # Kafka configuration
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  # Kafka Producer
  SPRING_KAFKA_PRODUCER_ACKS: "1"
  SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: "org.apache.kafka.common.serialization.StringSerializer"
  SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: "org.apache.kafka.common.serialization.StringSerializer"
  SPRING_KAFKA_PRODUCER_COMPRESSION_TYPE: "none"
  SPRING_KAFKA_PRODUCER_BATCH_SIZE: "16384"
  SPRING_KAFKA_PRODUCER_PROPERTIES_LINGER_MS: "10"
  SPRING_KAFKA_PRODUCER_BUFFER_MEMORY: "33554432"
  SPRING_KAFKA_PRODUCER_RETRIES: "3"
  SPRING_KAFKA_PRODUCER_PROPERTIES_RETRY_BACKOFF_MS: "100"
  SPRING_KAFKA_PRODUCER_PROPERTIES_REQUEST_TIMEOUT_MS: "30000"
  SPRING_KAFKA_PRODUCER_PROPERTIES_DELIVERY_TIMEOUT_MS: "120000"
  SPRING_KAFKA_PRODUCER_PROPERTIES_ENABLE_IDEMPOTENCE: "false"
  SPRING_KAFKA_PRODUCER_PROPERTIES_MAX_IN_FLIGHT_REQUESTS_PER_CONNECTION: "5"
  SPRING_KAFKA_PRODUCER_PROPERTIES_MAX_BLOCK_MS: "5000"
  SPRING_KAFKA_PRODUCER_PROPERTIES_METADATA_MAX_AGE_MS: "300000"

  # Kafka Consumer
  SPRING_KAFKA_CONSUMER_GROUP_ID: "spring-reactor-perf-group"
  SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: "earliest"
  SPRING_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT: "false"
  SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: "org.apache.kafka.common.serialization.StringDeserializer"
  SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: "org.apache.kafka.common.serialization.StringDeserializer"
  SPRING_KAFKA_CONSUMER_MAX_POLL_RECORDS: "500"
  SPRING_KAFKA_CONSUMER_FETCH_MIN_SIZE: "1"
  SPRING_KAFKA_CONSUMER_FETCH_MAX_WAIT: "500ms"
  SPRING_KAFKA_CONSUMER_PROPERTIES_SESSION_TIMEOUT_MS: "30000"
  SPRING_KAFKA_CONSUMER_PROPERTIES_HEARTBEAT_INTERVAL_MS: "10000"
  SPRING_KAFKA_CONSUMER_PROPERTIES_MAX_POLL_INTERVAL_MS: "300000"

  # Server configuration (Netty)
  SERVER_PORT: "8080"
  SERVER_NETTY_CONNECTION_TIMEOUT: "5000ms"
  SERVER_NETTY_IDLE_TIMEOUT: "60000ms"

  # Custom application properties
  REDIS_TTL: "300"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_TOPIC: "order-events"
  KAFKA_BROKERS: "kafka:9092"
  KAFKA_ACKS: "1"

  # Actuator and Metrics
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
  MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
  MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
  MANAGEMENT_METRICS_TAGS_APPLICATION: "spring-reactor-perf"
