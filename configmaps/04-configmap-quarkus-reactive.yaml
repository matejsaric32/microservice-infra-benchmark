apiVersion: v1
kind: ConfigMap
metadata:
  name: quarkus-reactive-perf-config
  namespace: perf-test
data:
  # Database
  QUARKUS_DATASOURCE_DB_KIND: "postgresql"
  QUARKUS_DATASOURCE_REACTIVE_URL: "postgresql://postgresql:5432/postgres"
  QUARKUS_DATASOURCE_REACTIVE_MAX_SIZE: "50"
  QUARKUS_APPLICATION_DATABASE_SCHEMA: "perf"

  # Database Performance Tuning
  QUARKUS_DATASOURCE_REACTIVE_CONNECT_TIMEOUT: "30S"
  QUARKUS_DATASOURCE_REACTIVE_IDLE_TIMEOUT: "PT10M"
  QUARKUS_DATASOURCE_REACTIVE_MAX_LIFETIME: "PT30M"
  QUARKUS_DATASOURCE_REACTIVE_RECONNECT_ATTEMPTS: "3"
  QUARKUS_DATASOURCE_REACTIVE_RECONNECT_INTERVAL: "PT1S"
  QUARKUS_DATASOURCE_REACTIVE_PIPELINING_LIMIT: "256"
  QUARKUS_DATASOURCE_REACTIVE_CACHE_PREPARED_STATEMENTS: "true"
  QUARKUS_DATASOURCE_REACTIVE_PREPARED_STATEMENT_CACHE_MAX_SIZE: "256"

  # Redis
  QUARKUS_REDIS_HOSTS: "redis://redis:6379"
  QUARKUS_REDIS_TIMEOUT: "10s"
  QUARKUS_REDIS_CLIENT_TYPE: "standalone"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_TOPIC: "order-events"
  KAFKA_PRODUCER_COMPRESSION_TYPE: "none"

  # Kafka Producer via MicroProfile Messaging
  MP_MESSAGING_OUTGOING_ORDER_CONNECTOR: "smallrye-kafka"
  MP_MESSAGING_OUTGOING_ORDER_TOPIC: "order-events"
  MP_MESSAGING_OUTGOING_ORDER_BOOTSTRAP_SERVERS: "kafka:9092"
  MP_MESSAGING_OUTGOING_ORDER_KEY_SERIALIZER: "org.apache.kafka.common.serialization.StringSerializer"
  MP_MESSAGING_OUTGOING_ORDER_VALUE_SERIALIZER: "org.apache.kafka.common.serialization.StringSerializer"
  MP_MESSAGING_OUTGOING_ORDER_EVENTS_OUT_CONNECTOR: "smallrye-kafka"
  MP_MESSAGING_OUTGOING_ORDER_EVENTS_OUT_TOPIC: "order-events"
  MP_MESSAGING_OUTGOING_ORDER_EVENTS_OUT_BOOTSTRAP_SERVERS: "kafka:9092"
  MP_MESSAGING_OUTGOING_ORDER_EVENTS_OUT_KEY_SERIALIZER: "org.apache.kafka.common.serialization.StringSerializer"
  MP_MESSAGING_OUTGOING_ORDER_EVENTS_OUT_VALUE_SERIALIZER: "org.apache.kafka.common.serialization.StringSerializer"
  MP_MESSAGING_OUTGOING_ORDER_EVENTS_OUT_ACKS: "all"
  MP_MESSAGING_OUTGOING_ORDER_EVENTS_OUT_COMPRESSION_TYPE: "none"
  MP_MESSAGING_OUTGOING_ORDER_EVENTS_OUT_LINGER_MS: "10"
  MP_MESSAGING_OUTGOING_ORDER_EVENTS_OUT_BATCH_SIZE: "16384"
  MP_MESSAGING_OUTGOING_ORDER_EVENTS_OUT_MAX_IN_FLIGHT_REQUESTS_PER_CONNECTION: "5"
  MP_MESSAGING_OUTGOING_ORDER_EVENTS_OUT_ENABLE_IDEMPOTENCE: "true"

  # HTTP
  QUARKUS_HTTP_PORT: "8080"