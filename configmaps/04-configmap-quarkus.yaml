apiVersion: v1
kind: ConfigMap
metadata:
  name: quarkus-perf-config
  namespace: perf-test
data:
  # Datasource configuration
  QUARKUS_DATASOURCE_DB_KIND: "postgresql"
  QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgresql:5432/postgres?currentSchema=perf"
  QUARKUS_DATASOURCE_JDBC_MIN_SIZE: "5"
  QUARKUS_DATASOURCE_JDBC_MAX_SIZE: "50"
  QUARKUS_DATASOURCE_JDBC_INITIAL_SIZE: "5"

  # HTTP
  QUARKUS_HTTP_PORT: "8080"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_TOPIC: "order-events"
  KAFKA_ACKS: "1"
  KAFKA_COMPRESSION_TYPE: "none"
  KAFKA_LINGER_MS: "0"
  KAFKA_BATCH_SIZE: "16384"
  QUARKUS_KAFKA_DEVSERVICES_ENABLED: "false"